<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Mission Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2em; background: #0b1725; color: #e0e0e0; }
        h2 { margin-top: 2em; }
        .stage-block { background: #16233d; margin: 1em 0; padding: 1em; border-radius: 8px; }
        .task-row { display: flex; align-items: center; margin-bottom: 0.5em; }
        .task-row label { flex:1; }
        button {
          background: #3358a0; color: #fff; border: none; padding: 0.3em 1em; border-radius: 4px; margin-left: 0.7em;
          cursor: pointer;
        }
        button[disabled] { opacity: 0.5; cursor: default; }
        .inline { display: inline-block; }
        input[type=password] { border-radius:4px; border:none; padding: 0.25em; }
    </style>
</head>
<body>
<h1>Space Mission Admin Panel</h1>

<div id="auth" style="margin-bottom:2em">
    <label>
        Admin Password:
        <input type="password" id="adminpw" />
    </label>
    <button onclick="loginAdmin()">Login</button>
    <span id="authFail" style="color:#f36; display:none;">Incorrect password</span>
</div>

<div id="panel" style="display:none">
    <h2>Mission State</h2>
    <p>Stage: <span id="currentStage"></span> / <span id="numStages"></span></p>
    <p>Active Events: <span id="activeEvents"></span></p>

    <h2>Stages & Tasks</h2>
    <div id="stages"></div>

    <button onclick="injectEvent()">Inject Random Event</button>
    <button onclick="skipStage()">Skip to Next Stage</button>
    <div style="color:#fd6;margin-top:1em;" id="statusMsg"></div>
</div>

<script src="/admin.js"></script>
</body>
</html>
